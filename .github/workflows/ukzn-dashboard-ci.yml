name: UKZN Dashboard CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  check-and-build-dashboard:
    name: Check and build UKZN dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ukzn-photo-dashboard

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ukzn-photo-dashboard/pnpm-lock.yaml

      - name: Install dashboard dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript check
        run: pnpm check

      - name: Production build
        run: pnpm build
